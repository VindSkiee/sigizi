name: PR Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]

jobs:
  label:
    name: Auto Label PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Auto label PR based on changed files
        uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/labeler.yml
          sync-labels: true

  assign-reviewers:
    name: Auto Assign Reviewers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Assign reviewers based on CODEOWNERS
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            // Get changed files
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const changedPaths = files.map(f => f.filename);

            // Determine teams to assign based on paths
            const reviewers = new Set();

            if (changedPaths.some(p => p.startsWith('apps/backend/'))) {
              reviewers.add('backend-team');
            }
            if (changedPaths.some(p => p.startsWith('apps/portal/'))) {
              reviewers.add('frontend-team');
            }
            if (changedPaths.some(p => p.startsWith('packages/'))) {
              reviewers.add('backend-team');
              reviewers.add('frontend-team');
            }
            if (changedPaths.some(p =>
              p.startsWith('.github/') ||
              p.startsWith('docs/') ||
              p === 'docker-compose.yml' ||
              p === 'turbo.json' ||
              p === 'pnpm-workspace.yaml' ||
              p === 'package.json'
            )) {
              reviewers.add('lead');
            }

            // Assign reviewers
            if (reviewers.size > 0) {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                reviewers: Array.from(reviewers),
              });
            }
